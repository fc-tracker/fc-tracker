# Every version tag is built here, by GitHub, from this repository's code – the installer people
# download from fc-tracker.com is this build. Each file gets a build attestation: a signed record
# (GitHub + Sigstore) that the file with this SHA-256 was built from this tag by this workflow.
# Check a download yourself:  gh attestation verify FC-Tracker-setup-<version>.exe --repo fc-tracker/fc-tracker
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # sign the attestations
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the installer
        shell: pwsh
        run: |
          # the in-app updater signature is added afterwards by the maintainer's key, which never
          # leaves their PC – this build only makes the installer itself
          '{ "bundle": { "createUpdaterArtifacts": false } }' | Set-Content -Encoding utf8 ci.conf.json
          npx tauri build --config ci.conf.json

      - name: Name the files
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $extVersion = (Get-Content extension/manifest.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $version" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/FC-Tracker_${version}_x64-setup.exe" "out/FC-Tracker-setup-$version.exe"
          # the extension folder as a zip, its contents at the top level ("Load unpacked" works on it)
          Push-Location extension
          tar -a -c -f "../out/FC-Tracker-extension-$extVersion.zip" (Get-ChildItem -Name)
          Pop-Location
          "app=out/FC-Tracker-setup-$version.exe" >> $env:GITHUB_OUTPUT
          "ext=out/FC-Tracker-extension-$extVersion.zip" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.files.outputs.app }}
            ${{ steps.files.outputs.ext }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = "${{ steps.files.outputs.app }}"; $ext = "${{ steps.files.outputs.ext }}"
          $rows = foreach ($f in @($app, $ext)) { "| $(Split-Path $f -Leaf) | ``$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())`` |" }
          @(
            "FC-Tracker ${{ steps.files.outputs.version }} – built by GitHub from this tag. The installer on https://www.fc-tracker.com/download is this file.",
            "",
            "| File | SHA-256 |",
            "|---|---|"
          ) + $rows + @(
            "",
            "Each file has a build attestation – check a download yourself:",
            '`gh attestation verify FC-Tracker-setup-${{ steps.files.outputs.version }}.exe --repo fc-tracker/fc-tracker`',
            "",
            "The VirusTotal scan of each version is linked on https://www.fc-tracker.com/download."
          ) | Set-Content -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" $app $ext --repo "$env:GITHUB_REPOSITORY" --title "FC-Tracker ${{ steps.files.outputs.version }}" --notes-file notes.md
